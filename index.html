<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Clock">
<title>Word Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Martian+Mono:wght@400;600&family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&family=Fragment+Mono&family=Azeret+Mono:wght@400;600&family=Red+Hat+Mono:wght@400;600&family=Chivo+Mono:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #000000;
    --unlit: #2a2a2a;
    --lit: #ffffff;
    --glow: rgba(255, 255, 255, 0.3);
    --hint: #555555;
    --font: "IBM Plex Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 4.6vmin;
    --lit-weight: 600;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-font="plex"] {
    --font: "IBM Plex Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 4.6vmin; --lit-weight: 600;
  }
  :root[data-font="space"] {
    --font: "Space Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 4.5vmin; --lit-weight: 700;
  }
  :root[data-font="martian"] {
    --font: "Martian Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 3.9vmin; --lit-weight: 600;
  }
  :root[data-font="dm"] {
    --font: "DM Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 4.6vmin; --lit-weight: 500;
  }
  :root[data-font="fragment"] {
    --font: "Fragment Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 4.5vmin; --lit-weight: 400;
  }
  :root[data-font="azeret"] {
    --font: "Azeret Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 4.2vmin; --lit-weight: 600;
  }
  :root[data-font="redhat"] {
    --font: "Red Hat Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 4.6vmin; --lit-weight: 600;
  }
  :root[data-font="jetbrains"] {
    --font: "JetBrains Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 4.6vmin; --lit-weight: 600;
  }
  :root[data-font="chivo"] {
    --font: "Chivo Mono", "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --size: 4.4vmin; --lit-weight: 600;
  }

  html { height: 100%; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .board {
    position: relative;
    width: 86vmin;
    height: 86vmin;
    max-width: 100%;
    padding: 7vmin;
    box-sizing: border-box;
  }
  .grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    grid-template-rows: repeat(10, 1fr);
    align-items: center;
    justify-items: center;
    font-family: var(--font);
    font-weight: 400;
    font-size: var(--size);
    line-height: 1;
  }
  .cell {
    color: var(--unlit);
    transition: color 1.2s ease, text-shadow 1.2s ease;
  }
  .cell.on {
    color: var(--lit);
    font-weight: var(--lit-weight);
    text-shadow: 0 0 1.4vmin var(--glow);
  }
  .dot {
    position: absolute;
    width: 1.3vmin;
    height: 1.3vmin;
    border-radius: 50%;
    background: var(--unlit);
    transition: background-color 1.2s ease, box-shadow 1.2s ease;
  }
  .dot.on { background: var(--lit); box-shadow: 0 0 1.4vmin var(--glow); }
  .d1 { top: 2.8vmin; left: 2.8vmin; }
  .d2 { top: 2.8vmin; right: 2.8vmin; }
  .d3 { bottom: 2.8vmin; right: 2.8vmin; }
  .d4 { bottom: 2.8vmin; left: 2.8vmin; }

  .hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3vmin);
    text-align: center;
    font-family: var(--font);
    font-size: 2vmin;
    color: var(--hint);
    transition: opacity 1.5s ease;
    pointer-events: none;
  }
  .hint.gone { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .cell, .dot, .hint { transition: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="board" role="img" id="board" aria-label="">
    <span class="dot d1" aria-hidden="true"></span>
    <span class="dot d2" aria-hidden="true"></span>
    <span class="dot d3" aria-hidden="true"></span>
    <span class="dot d4" aria-hidden="true"></span>
    <div class="grid" id="grid" aria-hidden="true"></div>
  </div>
</div>
<div class="hint" id="hint">Tap to change font</div>

<script>
(function () {
  var ROWS = [
    "ITRISVHALFO",
    "AQUARTERTEN",
    "TWENTYLFIVE",
    "TOVPASTKONE",
    "THREEJSEVEN",
    "FOURKTWOSIX",
    "ELEVENZNINE",
    "FIVEUEIGHTA",
    "TWELVEYTENX",
    "XRUOCLOCKGE"
  ];

  // [row, startCol, length]
  var WORDS = {
    IT: [0, 0, 2], IS: [0, 3, 2], HALF: [0, 6, 4],
    A: [1, 0, 1], QUARTER: [1, 1, 7], TEN: [1, 8, 3],
    TWENTY: [2, 0, 6], FIVE: [2, 7, 4],
    TO: [3, 0, 2], PAST: [3, 3, 4],
    OCLOCK: [9, 3, 6]
  };
  var HOURS = {
    1: [3, 8, 3], 2: [5, 5, 3], 3: [4, 0, 5], 4: [5, 0, 4],
    5: [7, 0, 4], 6: [5, 8, 3], 7: [4, 6, 5], 8: [7, 5, 5],
    9: [6, 7, 4], 10: [8, 7, 3], 11: [6, 0, 6], 12: [8, 0, 6]
  };
  var HOUR_NAMES = ["", "one", "two", "three", "four", "five", "six",
    "seven", "eight", "nine", "ten", "eleven", "twelve"];

  var BLOCKS = [
    ["OCLOCK"],
    ["FIVE", "PAST"],
    ["TEN", "PAST"],
    ["A", "QUARTER", "PAST"],
    ["TWENTY", "PAST"],
    ["TWENTY", "FIVE", "PAST"],
    ["HALF", "PAST"],
    ["TWENTY", "FIVE", "TO"],
    ["TWENTY", "TO"],
    ["A", "QUARTER", "TO"],
    ["TEN", "TO"],
    ["FIVE", "TO"]
  ];

  var grid = document.getElementById("grid");
  var board = document.getElementById("board");
  var dots = board.querySelectorAll(".dot");
  var cells = [];

  for (var r = 0; r < ROWS.length; r++) {
    cells.push([]);
    for (var c = 0; c < ROWS[r].length; c++) {
      var s = document.createElement("span");
      s.className = "cell";
      s.textContent = ROWS[r].charAt(c);
      grid.appendChild(s);
      cells[r].push(s);
    }
  }

  function light(spec, set) {
    for (var i = 0; i < spec[2]; i++) set[spec[0] + "," + (spec[1] + i)] = true;
  }

  var lastKey = "";

  function render() {
    var now = new Date();
    var m = now.getMinutes();
    var h = now.getHours();
    var key = h + ":" + m;
    if (key === lastKey) return;
    lastKey = key;

    var block = Math.floor(m / 5);
    var extra = m % 5;
    var hour = h % 12;
    if (block >= 7) hour = (hour + 1) % 12;
    if (hour === 0) hour = 12;

    var on = {};
    light(WORDS.IT, on);
    light(WORDS.IS, on);
    var words = BLOCKS[block];
    for (var i = 0; i < words.length; i++) {
      if (words[i] !== "OCLOCK") light(WORDS[words[i]], on);
    }
    light(HOURS[hour], on);
    if (block === 0) light(WORDS.OCLOCK, on);

    for (var r = 0; r < cells.length; r++) {
      for (var c = 0; c < cells[r].length; c++) {
        var want = on[r + "," + c] ? "cell on" : "cell";
        if (cells[r][c].className !== want) cells[r][c].className = want;
      }
    }
    for (var d = 0; d < dots.length; d++) {
      dots[d].className = dots[d].className.replace(" on", "") + (d < extra ? " on" : "");
    }

    var minuteWords = words.filter(function (w) { return w !== "OCLOCK"; })
      .map(function (w) { return w.toLowerCase(); }).join(" ");
    var phrase = "It is " + (minuteWords ? minuteWords + " " : "") + HOUR_NAMES[hour] +
      (block === 0 ? " o'clock" : "");
    if (extra) phrase += ", plus " + extra + (extra === 1 ? " minute" : " minutes");
    board.setAttribute("aria-label", phrase);
  }

  // Fonts: tap to cycle, choice is remembered
  var FONTS = ["plex", "space", "martian", "dm", "fragment", "azeret", "redhat", "chivo", "jetbrains"];
  var root = document.documentElement;
  var font = null;
  try { font = localStorage.getItem("wordclock-font"); } catch (e) {}
  if (FONTS.indexOf(font) === -1) font = "plex";
  root.setAttribute("data-font", font);

  document.body.addEventListener("click", function () {
    font = FONTS[(FONTS.indexOf(font) + 1) % FONTS.length];
    root.setAttribute("data-font", font);
    try { localStorage.setItem("wordclock-font", font); } catch (e) {}
  });

  setTimeout(function () {
    document.getElementById("hint").className = "hint gone";
  }, 4000);

  render();
  setInterval(render, 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { lastKey = ""; render(); }
  });
})();
</script>
</body>
</html>
