<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Clock">
<title>Word Clock</title>
<style>
  /* Faces: graphite (dark), paper (light), darkroom (safelight red, for night) */
  :root {
    --bg: #dcdfe2;
    --unlit: #c3c8ce;
    --lit: #1b2a3a;
    --glow: rgba(27, 42, 58, 0);
    --hint: #6b7480;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1d1f;
      --unlit: #2c2e32;
      --lit: #f2ead8;
      --glow: rgba(242, 234, 216, 0.35);
      --hint: #6a6d73;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1d1f;
    --unlit: #2c2e32;
    --lit: #f2ead8;
    --glow: rgba(242, 234, 216, 0.35);
    --hint: #6a6d73;
  }
  /* An explicit face choice overrides the system appearance */
  :root[data-face="graphite"] {
    --bg: #1c1d1f; --unlit: #2c2e32; --lit: #f2ead8;
    --glow: rgba(242, 234, 216, 0.35); --hint: #6a6d73;
  }
  :root[data-face="paper"] {
    --bg: #dcdfe2; --unlit: #c3c8ce; --lit: #1b2a3a;
    --glow: rgba(27, 42, 58, 0); --hint: #6b7480;
  }
  :root[data-face="darkroom"] {
    --bg: #000000; --unlit: #1d0604; --lit: #e8321f;
    --glow: rgba(232, 50, 31, 0.45); --hint: #4a120c;
  }

  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    transition: background-color 0.8s ease;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .board {
    position: relative;
    width: 86vmin;
    height: 86vmin;
    max-width: 100%;
    padding: 7vmin;
    box-sizing: border-box;
  }
  .grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    grid-template-rows: repeat(10, 1fr);
    align-items: center;
    justify-items: center;
    font-family: "Avenir Next", "Avenir", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    font-size: 4.6vmin;
    line-height: 1;
  }
  .cell {
    color: var(--unlit);
    transition: color 1.2s ease, text-shadow 1.2s ease;
  }
  .cell.on {
    color: var(--lit);
    font-weight: 600;
    text-shadow: 0 0 1.4vmin var(--glow);
  }
  .dot {
    position: absolute;
    width: 1.3vmin;
    height: 1.3vmin;
    border-radius: 50%;
    background: var(--unlit);
    transition: background-color 1.2s ease, box-shadow 1.2s ease;
  }
  .dot.on { background: var(--lit); box-shadow: 0 0 1.4vmin var(--glow); }
  .d1 { top: 2.8vmin; left: 2.8vmin; }
  .d2 { top: 2.8vmin; right: 2.8vmin; }
  .d3 { bottom: 2.8vmin; right: 2.8vmin; }
  .d4 { bottom: 2.8vmin; left: 2.8vmin; }

  .hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3vmin);
    text-align: center;
    font-family: "Avenir Next", "Avenir", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 2vmin;
    color: var(--hint);
    opacity: 1;
    transition: opacity 1.5s ease;
    pointer-events: none;
  }
  .hint.gone { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    body, .cell, .dot, .hint { transition: none; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="board" role="img" id="board" aria-label="">
    <span class="dot d1" aria-hidden="true"></span>
    <span class="dot d2" aria-hidden="true"></span>
    <span class="dot d3" aria-hidden="true"></span>
    <span class="dot d4" aria-hidden="true"></span>
    <div class="grid" id="grid" aria-hidden="true"></div>
  </div>
</div>
<div class="hint" id="hint">Tap to change color</div>

<script>
(function () {
  var ROWS = [
    "ITRISVHALFO",
    "AQUARTERTEN",
    "TWENTYLFIVE",
    "TOVPASTKONE",
    "THREEJSEVEN",
    "FOURKTWOSIX",
    "ELEVENZNINE",
    "FIVEUEIGHTA",
    "TWELVEYTENX",
    "XRUOCLOCKGE"
  ];

  // [row, startCol, length]
  var WORDS = {
    IT: [0, 0, 2], IS: [0, 3, 2], HALF: [0, 6, 4],
    A: [1, 0, 1], QUARTER: [1, 1, 7], TEN: [1, 8, 3],
    TWENTY: [2, 0, 6], FIVE: [2, 7, 4],
    TO: [3, 0, 2], PAST: [3, 3, 4],
    OCLOCK: [9, 3, 6]
  };
  var HOURS = {
    1: [3, 8, 3], 2: [5, 5, 3], 3: [4, 0, 5], 4: [5, 0, 4],
    5: [7, 0, 4], 6: [5, 8, 3], 7: [4, 6, 5], 8: [7, 5, 5],
    9: [6, 7, 4], 10: [8, 7, 3], 11: [6, 0, 6], 12: [8, 0, 6]
  };
  var HOUR_NAMES = ["", "one", "two", "three", "four", "five", "six",
    "seven", "eight", "nine", "ten", "eleven", "twelve"];

  // Minute phrases for each five-minute block
  var BLOCKS = [
    ["OCLOCK"],
    ["FIVE", "PAST"],
    ["TEN", "PAST"],
    ["A", "QUARTER", "PAST"],
    ["TWENTY", "PAST"],
    ["TWENTY", "FIVE", "PAST"],
    ["HALF", "PAST"],
    ["TWENTY", "FIVE", "TO"],
    ["TWENTY", "TO"],
    ["A", "QUARTER", "TO"],
    ["TEN", "TO"],
    ["FIVE", "TO"]
  ];

  var grid = document.getElementById("grid");
  var board = document.getElementById("board");
  var dots = board.querySelectorAll(".dot");
  var cells = [];

  for (var r = 0; r < ROWS.length; r++) {
    cells.push([]);
    for (var c = 0; c < ROWS[r].length; c++) {
      var s = document.createElement("span");
      s.className = "cell";
      s.textContent = ROWS[r].charAt(c);
      grid.appendChild(s);
      cells[r].push(s);
    }
  }

  function light(spec, set) {
    for (var i = 0; i < spec[2]; i++) set[spec[0] + "," + (spec[1] + i)] = true;
  }

  var lastKey = "";

  function render() {
    var now = new Date();
    var m = now.getMinutes();
    var h = now.getHours();
    var key = h + ":" + m;
    if (key === lastKey) return;
    lastKey = key;

    var block = Math.floor(m / 5);
    var extra = m % 5;
    var hour = h % 12;
    if (block >= 7) hour = (hour + 1) % 12;
    if (hour === 0) hour = 12;

    var on = {};
    light(WORDS.IT, on);
    light(WORDS.IS, on);
    var words = BLOCKS[block];
    for (var i = 0; i < words.length; i++) {
      if (words[i] !== "OCLOCK") light(WORDS[words[i]], on);
    }
    light(HOURS[hour], on);
    if (block === 0) light(WORDS.OCLOCK, on);

    for (var r = 0; r < cells.length; r++) {
      for (var c = 0; c < cells[r].length; c++) {
        var lit = !!on[r + "," + c];
        var el = cells[r][c];
        if (lit && el.className !== "cell on") el.className = "cell on";
        else if (!lit && el.className !== "cell") el.className = "cell";
      }
    }
    for (var d = 0; d < dots.length; d++) {
      dots[d].className = dots[d].className.replace(" on", "") + (d < extra ? " on" : "");
    }

    var phrase = "It is " + words.map(function (w) {
      return w === "OCLOCK" ? "" : w.toLowerCase();
    }).join(" ").replace(/\s+/g, " ").trim();
    phrase += (phrase === "It is" ? " " : " ") + HOUR_NAMES[hour] + (block === 0 ? " o'clock" : "");
    if (extra) phrase += ", plus " + extra + (extra === 1 ? " minute" : " minutes");
    board.setAttribute("aria-label", phrase);
  }

  // Faces
  var FACES = ["graphite", "paper", "darkroom"];
  var root = document.documentElement;
  var face = null;
  try { face = localStorage.getItem("wordclock-face"); } catch (e) {}
  if (FACES.indexOf(face) === -1) {
    face = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ? "graphite" : "paper";
  }
  root.setAttribute("data-face", face);

  document.body.addEventListener("click", function () {
    var i = (FACES.indexOf(face) + 1) % FACES.length;
    face = FACES[i];
    root.setAttribute("data-face", face);
    try { localStorage.setItem("wordclock-face", face); } catch (e) {}
  });

  setTimeout(function () {
    document.getElementById("hint").className = "hint gone";
  }, 4000);

  render();
  setInterval(render, 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { lastKey = ""; render(); }
  });
})();
</script>
</body>
</html>
